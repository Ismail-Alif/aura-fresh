<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="coverRadial" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="65%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011b15" />
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGradCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#022c22" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Solid Canvas Background -->
  <rect width="1640" height="624" fill="url(#coverRadial)" />

  <!-- Center Ambient Glow -->
  <circle cx="820" cy="312" r="380" fill="url(#centerGlow)" />

  <!-- Abstract Aura Geometry Rings (Desktop Expansion) -->
  <g opacity="0.12" stroke="#34d399" fill="none">
    <circle cx="820" cy="312" r="260" stroke-width="1.5" />
    <circle cx="820" cy="312" r="390" stroke-width="1.8" stroke-dasharray="14 10" />
    <circle cx="820" cy="312" r="540" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.6" />
  </g>

  <!-- ============================================== -->
  <!-- UNIVERSAL MOBILE & DESKTOP SAFE ZONE (CENTERED) -->
  <!-- ============================================== -->
  
  <!-- 1. Top Pill Badge -->
  <g transform="translate(820, 150)">
    <rect x="-140" y="-19" width="280" height="38" rx="19" fill="#042f2e" stroke="#10b981" stroke-width="1.5" opacity="0.95" />
    <text x="0" y="5" text-anchor="middle" font-family="'SolaimanLipi', 'Hind Siliguri', system-ui, sans-serif" font-weight="700" font-size="16" fill="#34d399">
      🌿 প্রাকৃতিক সুরক্ষা ও সতেজতা
    </text>
  </g>

  <!-- 2. Logo Row (Aura Shield Emblem + Bold Brand Name) -->
  <g transform="translate(820, 245)">
    <!-- Shield Emblem (Scaled & Positioned Left of Wordmark) -->
    <g transform="translate(-175, 0) scale(0.95)">
      <circle cx="0" cy="0" r="36" fill="none" stroke="url(#shieldGradCover)" stroke-width="4.2" stroke-dasharray="175 35" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.4" stroke-dasharray="7 5"/>
      <path d="M 0 -21 C 12 -11, 14 7, 0 19 C -14 7, -12 -11, 0 -21 Z" fill="url(#shieldGradCover)"/>
      <path d="M 0 -14 L 0 14" stroke="#022c22" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="24" cy="-24" r="3" fill="#34d399" />
      <circle cx="-24" cy="20" r="2" fill="#6ee7b7" />
    </g>

    <!-- Typography -->
    <text x="-120" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="72" fill="#ffffff" letter-spacing="-1.5">
      Aura<tspan fill="#34d399">Fresh</tspan>
    </text>
  </g>

  <!-- 3. Bengali Tagline (SolaimanLipi) -->
  <text x="820" y="340" text-anchor="middle" font-family="'SolaimanLipi', 'Hind Siliguri', system-ui, sans-serif" font-weight="700" font-size="27" fill="#f1f5f9" letter-spacing="0.5">
    আপনার ঘরের বিশুদ্ধ ও সুরক্ষিত আবাসন
  </text>

  <!-- 4. Three Minimal Value Badges (Mobile-Safe Row) -->
  <g transform="translate(820, 412)">
    <!-- Badge 1: বায়ো-সেফ -->
    <g transform="translate(-295, 0)">
      <rect x="0" y="-20" width="180" height="40" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1.2" opacity="0.9" />
      <text x="90" y="6" text-anchor="middle" font-family="'SolaimanLipi', 'Hind Siliguri', system-ui, sans-serif" font-weight="700" font-size="15.5" fill="#a7f3d0">
        ✔ ১০০% বায়ো-সেফ
      </text>
    </g>

    <!-- Badge 2: কেমিক্যালমুক্ত সুরক্ষা -->
    <g transform="translate(-95, 0)">
      <rect x="0" y="-20" width="205" height="40" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1.2" opacity="0.9" />
      <text x="102.5" y="6" text-anchor="middle" font-family="'SolaimanLipi', 'Hind Siliguri', system-ui, sans-serif" font-weight="700" font-size="15.5" fill="#a7f3d0">
        ✔ কেমিক্যালমুক্ত সুরক্ষা
      </text>
    </g>

    <!-- Badge 3: দীর্ঘস্থায়ী সতেজতা -->
    <g transform="translate(130, 0)">
      <rect x="0" y="-20" width="190" height="40" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1.2" opacity="0.9" />
      <text x="95" y="6" text-anchor="middle" font-family="'SolaimanLipi', 'Hind Siliguri', system-ui, sans-serif" font-weight="700" font-size="15.5" fill="#a7f3d0">
        ✔ দীর্ঘস্থায়ী সতেজতা
      </text>
    </g>
  </g>
</svg>
