<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="28" fill="#022c22" />

  <g transform="translate(50, 50) scale(0.95)">
    <!-- Outer Aura Ring with Dash Break -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#favShieldGrad)" stroke-width="5" stroke-dasharray="210 40" stroke-linecap="round"/>
    
    <!-- Central Shield Leaf (Protection & Nature) -->
    <path d="M 0 -24 C 14 -12, 16 8, 0 22 C -16 8, -14 -12, 0 -24 Z" fill="url(#favShieldGrad)"/>
    <!-- Central Spine & Veins -->
    <path d="M 0 -16 L 0 16" stroke="#022c22" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 -4 L 7 -9" stroke="#022c22" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 0 3 L -7 -2" stroke="#022c22" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Sparkles -->
    <circle cx="28" cy="-28" r="3.5" fill="#34d399" />
  </g>
</svg>
